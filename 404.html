<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found – Mikaela Haage</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/icons/icon-32.png">
  <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Prompt:wght@400;500;600;700&display=swap">
  <!-- GitHub Pages shows this page for any address that doesn't exist, at any
       depth, so every link starts from the site root. -->
  <link rel="stylesheet" href="/styles.css">
  <style>
    .not-found {
      display: grid;
      align-content: center;
      justify-items: start;
      gap: 24px;
      min-height: calc(100svh - 120px);
      padding: 48px var(--gutter);
      max-width: 900px;
      margin-inline: auto;
    }
    .not-found .sambla-text { margin: 0; }
  </style>
</head>
<body>

  <header class="project-header project-header--plain">
    <a class="name" href="/">Mikaela Haage</a>
  </header>

  <main class="not-found">
    <h1 class="sambla-title">Page not found</h1>
    <p class="sambla-text">The page you were looking for isn’t here. It may have moved, or the link may be wrong.</p>
    <a class="case-cta" href="/">Back to the start page</a>
  </main>

</body>
</html>
