  <link rel="stylesheet" href="styles.css">
  <script>
    // The compact header rolls down only when it first appears. Coming from
    // another page that showed it too, it stays put.
    try {
      if (document.referrer.startsWith(location.origin + "/") && sessionStorage.getItem("compact-header") === "1") {
        document.documentElement.classList.add("header-stays");
      }
      addEventListener("pagehide", () => {
        const header = document.querySelector(".project-header");
        sessionStorage.setItem("compact-header", header && header.offsetParent ? "1" : "0");
      });
      // Leaving for another page: the header shows at once (even if it had
      // slid away while scrolling), so the page change can keep it in place.
      addEventListener("pageswap", () => {
        const header = document.querySelector(".project-header");
        if (!header) return;
        header.style.transition = "none";
        header.classList.remove("is-hidden");
      });
    } catch (e) {}
  </script>
  <script>
    // Intro: start hidden before first paint. Skipped for reduced motion, deep links,
    // and when arriving from another page on the site (the page transition runs instead).
    // A reload keeps the original referrer, so it counts as a fresh visit.
    const navType = (performance.getEntriesByType("navigation")[0] || {}).type;
    const fromSite = navType !== "reload" && document.referrer.startsWith(location.origin + "/");
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches && !location.hash && !fromSite) {
      history.scrollRestoration = "manual";
      document.documentElement.classList.add("intro");
    }
  </script>
